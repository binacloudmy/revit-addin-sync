# Compile check on every push/PR. Runs on Linux: EnableWindowsTargeting in the
# csproj lets net8.0-windows + WPF compile without a Windows runner (cheaper,
# 1x minute billing). Release builds use windows-latest — see release.yml.

name: build

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build plugin
        run: dotnet build RevitWebAppSync.csproj -c Release

      - name: Build loader
        run: dotnet build BinaLoader/BinaLoader.csproj -c Release
