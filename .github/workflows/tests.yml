# Unit tests (Tests/Tests.csproj, net10.0-windows) on every PR.
# SkipRevitSources is a no-op since the deprecated DocumentChangedIndexer link
# (whose tests loaded RevitAPI.dll at runtime) was deleted; kept so the
# command line stays stable.
name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run unit tests
        run: dotnet test Tests/Tests.csproj -c Release -p:SkipRevitSources=true --logger "console;verbosity=normal"

  # Installer scripts are PowerShell that only ever runs on a drafter's box or
  # a release runner — neither of which is where they get written. Two gates:
  #
  #   parse   — every installer/*.ps1 must at least PARSE, under pwsh 7 and
  #             Windows PowerShell 5.1 (no pwsh on the dev Mac; a script once
  #             shipped having never been fed to a parser).
  # (The engine-bundle fetch gate went with the retired engine.)
  installer-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every installer script (pwsh 7)
        shell: pwsh
        run: installer/tests/parse-check.ps1

      - name: Parse every installer script (Windows PowerShell 5.1)
        # 5.1 rejects syntax pwsh 7 accepts, so both must pass.
        shell: powershell
        run: installer/tests/parse-check.ps1
