# Release build + verification pipeline (sovereign delivery).
#
# Flow: git tag v0.0.2 && git push --tags
#   → builds plugin + loader with Version=0.0.2 (UNSIGNED — CI has no cert)
#   → RevitWebAppSync-0.0.2.zip (OTA payload) + RevitCopilot-0.0.2-setup.exe
#   → uploads them as GitHub workflow artifacts (build record / staging smoke)
#
# Two actors, deliberately split — this workflow is ONLY the first half:
#
#   RUNNER (this workflow, automated, self-hosted):
#     - builds the plugin payload + loaders + installer EXE, UNSIGNED;
#     - uploads them as GitHub workflow artifacts (build record / staging smoke);
#     - publishes NOTHING users can download: no GitHub Release, no TM One upload,
#       no pointer flip. It cannot — it has no cert and no TM One creds.
#
#   OPERATOR (separate, manual, on the sovereign signing box):
#     - runs installer\sign-release.ps1, which rebuilds + SIGNS every payload DLL
#       and the setup EXE, uploads the signed installer + OTA zip to TM One, and
#       flips the latest.json pointer that bina-ai /addin/download and
#       /addin/version.json resolve. THIS is go-live.
#
# Why the split: unsigned bytes never reach a user-facing URL (the signing gate);
# build compute stays in-country; TM One credentials live only on the signing
# box, never in GitHub secrets. This job is the fast "does the tag build + harvest
# cleanly" gate the operator relies on before signing.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.0.2) — build only, no publish'
        required: true

permissions:
  contents: read

jobs:
  release:
    # TEMPORARY: GitHub-hosted. The sovereign intent is a self-hosted Windows
    # runner so build compute stays in-country (added 2026-07-27, PR #51) —
    # but no such runner is registered, so every tagged release simply QUEUED
    # forever with no failure and no log. v0.0.30-staging sat unassigned for
    # 14 minutes before anyone noticed, because an unassigned job looks
    # identical to a slow one.
    #
    # Reverted to unblock staging. Restore `runs-on: [self-hosted, windows]`
    # once a runner is registered (repo Settings -> Actions -> Runners), and
    # verify by pushing a throwaway tag BEFORE relying on it for a release —
    # this failure mode is silent.
    #
    # Note what this does NOT change: the runner still produces unsigned
    # artifacts only. Signing, the TM One upload and the latest.json flip stay
    # on the operator's box, so no key or credential is exposed by building
    # here rather than in-country.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0 builds net8.0-windows (+ net48 via reference assemblies);
          # 10.0 builds the Revit 2027 net10.0-windows payload.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          # Exactly two channels:
          #   vX.Y.Z          -> Release build (prod backend), fleet OTA
          #                      (becomes releases/latest -> mandatory).
          #   vX.Y.Z-staging  -> Staging build (staging backend, updater
          #                      disabled via .env.staging), published as
          #                      a GitHub PRERELEASE, which releases/latest
          #                      excludes -> no prod user is ever touched;
          #                      testers install by direct link only.
          # Binaries always carry the numeric core (AssemblyVersion=$(Version)
          # cannot take a suffix).
          if ($v -notmatch '^(\d+\.\d+\.\d+)(-staging)?$') {
            throw "Bad version '$v' — want MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-staging"
          }
          $numeric = $Matches[1]
          $isStaging = [bool]$Matches[2]
          "version=$numeric" >> $env:GITHUB_OUTPUT
          "fullversion=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($isStaging) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "config=$(if ($isStaging) { 'Staging' } else { 'Release' })" >> $env:GITHUB_OUTPUT

      - name: Publish plugin (OTA payload, per-target subfolders)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          # Multi-year layout (BinaLoader ResolvePayloadDir): one subfolder per
          # target runtime + a root manifest.json carrying the year->subfolder
          # map. ALWAYS publish with an explicit -f — a multi-TFM publish
          # without one shipped a net10 payload to a .NET 8 Revit (2026-07-13).
          $targets = [ordered]@{ "net8.0-windows" = "net8.0"; "net10.0-windows" = "net10.0" }
          if ((Get-Content RevitWebAppSync.csproj -Raw) -match '<TargetFrameworks>[^<]*net48') {
            $targets["net48"] = "net48"   # Phase B auto-activates
          }
          $yearMap = [ordered]@{}
          foreach ($tfm in $targets.Keys) {
            $sub = $targets[$tfm]
            dotnet publish RevitWebAppSync.csproj -c '${{ steps.ver.outputs.config }}' -f $tfm -o "artifacts/plugin/$sub" -p:Version=$v
            if ($LASTEXITCODE -ne 0) { exit 1 }
            @{ version = $v; assembly = 'RevitWebAppSync.dll'; entryType = 'RevitWebAppSync.App' } |
              ConvertTo-Json | Set-Content "artifacts/plugin/$sub/manifest.json"
            switch ($sub) {
              "net48"   { $yearMap["2023"] = $sub; $yearMap["2024"] = $sub }
              "net8.0"  { $yearMap["2025"] = $sub; $yearMap["2026"] = $sub }
              "net10.0" { $yearMap["2027"] = $sub }
            }
          }
          # Root manifest: which dll/type to bootstrap + the targets map.
          @{ version = $v; assembly = 'RevitWebAppSync.dll'; entryType = 'RevitWebAppSync.App'; targets = $yearMap } |
            ConvertTo-Json | Set-Content artifacts/plugin/manifest.json
          & installer/prune-payload.ps1 -PluginDir artifacts/plugin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem artifacts/plugin -Recurse -Filter *.pdb | Remove-Item -ErrorAction SilentlyContinue

      - name: Publish loaders (net8 for 2025-2027, net48 for 2024)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          dotnet publish BinaLoader/BinaLoader.csproj -c Release -f net8.0-windows -o artifacts/loader-net8 -p:Version=$v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item BinaLoader/BinaSync.addin artifacts/loader-net8/
          dotnet publish BinaLoader/BinaLoader.csproj -c Release -f net48 -o artifacts/loader-net48 -p:Version=$v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item BinaLoader/BinaSync.addin artifacts/loader-net48/
          Get-ChildItem artifacts -Recurse -Filter *.pdb | Remove-Item -ErrorAction SilentlyContinue

      # Optional colocated-engine channel: set the ENGINE_ZIP_URL repository
      # variable (Settings -> Secrets and variables -> Actions -> Variables) to
      # a bina-engine-<ver>.zip built by bina-ai scripts/build-engine-bundle.ps1
      # (e.g. a previous release's asset URL, or blob storage). When set, the
      # release re-attaches the zip, version.json carries the flat
      # engineVersion/engineUrl/engineSha256 fields UpdateService.CheckEngineAsync
      # reads, and the installer seeds the bundle. Unset = engine channel inert,
      # release is byte-identical to an addin-only one.
      - name: Fetch engine bundle (optional)
        id: engine
        shell: pwsh
        run: |
          $url = '${{ vars.ENGINE_ZIP_URL }}'
          if (-not $url) {
            Write-Host "ENGINE_ZIP_URL not set — addin-only release"
            "present=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Invoke-WebRequest $url -OutFile engine-download.zip
          Expand-Archive engine-download.zip -DestinationPath artifacts/engine
          $manifest = Get-Content artifacts/engine/engine-version.json -Raw | ConvertFrom-Json
          $ev = $manifest.engine_version
          if (-not $ev) { throw "engine-version.json in $url has no engine_version" }
          $zip = "bina-engine-$ev.zip"
          Move-Item engine-download.zip $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "engine bundle $ev ($zip, sha256=$sha)"
          "present=true" >> $env:GITHUB_OUTPUT
          "version=$ev" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Zip payload + feed json
        id: payload
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $zip = "RevitWebAppSync-$v.zip"
          Compress-Archive -Path artifacts/plugin/* -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $feed = [ordered]@{
            version   = $v
            url       = "https://github.com/${{ github.repository }}/releases/download/v$v/$zip"
            sha256    = $sha
            notes     = "BINA Sync $v"
            # Stale clients are blocked until they update (UpdateWindow gate).
            # Flip to $false for releases old builds may keep using.
            mandatory = $true
          }
          # Colocated-engine channel: FLAT fields, the shape
          # UpdateService.CheckEngineAsync actually reads (the old nested
          # {engine:{...}} block was never consumed by any client).
          if ('${{ steps.engine.outputs.present }}' -eq 'true') {
            $feed.engineVersion = '${{ steps.engine.outputs.version }}'
            $feed.engineUrl     = "https://github.com/${{ github.repository }}/releases/download/v$v/${{ steps.engine.outputs.zip }}"
            $feed.engineSha256  = '${{ steps.engine.outputs.sha256 }}'
            Write-Host "feed carries engine $($feed.engineVersion)"
          }
          $feed | ConvertTo-Json -Depth 5 | Set-Content version.json
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup EXE)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          # Seed folder must look exactly like an updater-staged one.
          Set-Content artifacts/plugin/.complete $v
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          # ABSOLUTE source dirs — relative paths once made the old WiX MSI
          # harvest nothing and ship 32KB shells (v0.0.1-v0.0.6).
          $loaderNet8Dir = (Resolve-Path artifacts/loader-net8).Path
          $pluginDir = (Resolve-Path artifacts/plugin).Path
          # Addins\2024 registration only when a 2024 payload exists — a net48
          # loader with nothing to load dead-ends 2024 users on a reinstall dialog.
          $net48Arg = @()
          if (Test-Path artifacts/plugin/net48) {
            $net48Arg = @("/DLoaderNet48Dir=$((Resolve-Path artifacts/loader-net48).Path)")
          }
          # Seed the fetched engine bundle into the installer. DestDir must be
          # the ENGINE's own version (EngineManager scans engine\<ver>\ by
          # semver), never the addin version.
          $engineArg = @()
          if ('${{ steps.engine.outputs.present }}' -eq 'true') {
            $engineDir = (Resolve-Path artifacts/engine).Path
            $engineArg = @("/DEngineDir=$engineDir", "/DEngineVersion=${{ steps.engine.outputs.version }}")
          }
          & $iscc installer/RevitCopilot.iss /DAppVersion=$v "/DLoaderNet8Dir=$loaderNet8Dir" "/DPluginDir=$pluginDir" @net48Arg @engineArg /Oinstaller
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item "installer/RevitCopilot-$v-setup.exe" .
          # Guard: a payload-less installer is tiny; the real one carries the
          # whole plugin. Never ship a shell again.
          $size = (Get-Item "RevitCopilot-$v-setup.exe").Length
          if ($size -lt 1MB) { throw "Installer is only $([math]::Round($size/1KB)) KB — harvest failed, refusing to release" }

      # No GitHub Release, no TM One upload here — CI produces UNSIGNED bytes.
      # Publishing is the operator's sign-and-flip step (installer\sign-release.ps1),
      # which SIGNS the payload + EXE, uploads to TM One and flips the pointer.
      # This artifact is the build record + a staging smoke source only.
      - name: Upload build artifacts (unsigned build record)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.fullversion }}
          path: |
            RevitWebAppSync-*.zip
            RevitCopilot-*-setup.exe

  # ─── Staging auto-sign + publish ────────────────────────────────────────
  # STAGING ONLY, and a SEPARATE job on purpose.
  #
  # Separate because the build must not depend on the signing box being up.
  # When release.yml briefly ran wholly on [self-hosted, windows] with no
  # runner registered, v0.0.30-staging simply QUEUED — no failure, no log,
  # nothing to debug, because an unassigned job is indistinguishable from a
  # slow one. Split like this, the build always runs on windows-latest and
  # only this job waits; artifacts still exist and the operator can sign by
  # hand as before.
  #
  # Why self-hosted is unavoidable here: Certum's private key never leaves
  # their cloud, and SimplySign Desktop must hold an AUTHENTICATED session
  # before signtool can see the key. There is no API credential to put in
  # GitHub secrets — an ephemeral GitHub-hosted VM cannot hold that session.
  # So this job runs on the signing box, which keeps SimplySign logged in.
  # That session EXPIRES; the preflight below reports it plainly instead of
  # failing later inside signtool.
  #
  # GATED OFF UNTIL A RUNNER EXISTS. `runs-on: [self-hosted, windows]` with no
  # registered runner does not fail — it QUEUES, forever, exactly as described
  # four paragraphs up. The preflight cannot save us there: a job whose labels
  # match no runner never starts, so not one of its steps runs and there is no
  # message to read. Re-introducing that condition here would have reproduced
  # the same invisible hang on the next -staging tag, with the incident report
  # sitting directly above it.
  #
  # So the job is skipped unless the repo variable SELF_HOSTED_SIGNER is
  # 'true'. A skipped job is legible — it appears in the checks list greyed
  # out — whereas a queued one is indistinguishable from a slow build. To turn
  # it on: register the signing box as a self-hosted runner with the
  # `windows` label, then
  #   gh variable set SELF_HOSTED_SIGNER --body true
  # Until then, staging publishes the way 0.0.30 did: run
  # installer\sign-release.ps1 on the signing box by hand. The build job still
  # runs on windows-latest and still uploads artifacts, so nothing is blocked.
  #
  # Prod is deliberately excluded. A fleet-wide update should have a human
  # in the loop, so `v0.0.31` (no suffix) still goes through
  # installer\sign-release.ps1 by hand.
  sign-staging:
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && endsWith(github.ref_name, '-staging')
      && vars.SELF_HOSTED_SIGNER == 'true'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          # sign-release.ps1 resolves the tag with `git rev-list -n 1 $Tag`
          # and refuses unless HEAD matches it, so the full history + tags
          # must be present. A shallow checkout fails that gate.
          fetch-depth: 0

      # Fail BEFORE the expensive part. sign-release.ps1 does its full signed
      # build at line ~97 but only validates TM One credentials at line ~134,
      # so a missing variable would compile and sign everything, burn a
      # SimplySign session, then die before publishing a single byte.
      - name: Preflight (fail fast, protect the signing session)
        shell: pwsh
        env:
          TMONE_SERVER: ${{ secrets.TMONE_SERVER }}
          TMONE_BUCKET: ${{ secrets.TMONE_BUCKET }}
          TMONE_ACCESS_KEY_ID: ${{ secrets.TMONE_ACCESS_KEY_ID }}
          TMONE_SECRET_ACCESS_KEY: ${{ secrets.TMONE_SECRET_ACCESS_KEY }}
        run: |
          $missing = @()
          foreach ($k in 'TMONE_SERVER','TMONE_BUCKET','TMONE_ACCESS_KEY_ID','TMONE_SECRET_ACCESS_KEY') {
            if (-not (Get-Item "env:$k" -ErrorAction SilentlyContinue).Value) { $missing += $k }
          }
          if ($missing) { throw "Missing repo secrets: $($missing -join ', ')" }

          # The upload step shells out to a bare `aws`. It was not installed on
          # the signing box the first time this was attempted, so every S3 copy
          # would have thrown AFTER signing.
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            throw "aws CLI not on PATH — install once: winget install --id Amazon.AWSCLI -e"
          }

          # SIGNTOOL_ARGS and -Thumbprint are mutually exclusive in the script;
          # a stale value in the machine environment would abort the run.
          if ($env:SIGNTOOL_ARGS) { throw "SIGNTOOL_ARGS is set; unset it so -Thumbprint takes the pre-trust path" }

          # Certum's key is only visible while SimplySign holds a session. If it
          # lapsed, say so plainly instead of failing later inside signtool.
          $tp = '${{ secrets.CERT_THUMBPRINT }}'
          if (-not $tp) { throw "CERT_THUMBPRINT secret not set" }
          if (-not (Test-Path "Cert:\CurrentUser\My\$tp")) {
            throw "Cert $tp not in CurrentUser\My — SimplySign session has expired. Re-authenticate on this box."
          }
          Write-Host "preflight OK — creds present, aws found, SimplySign session live"

      - name: Sign, upload to TM One, flip latest.json
        shell: pwsh
        env:
          TMONE_SERVER: ${{ secrets.TMONE_SERVER }}
          TMONE_BUCKET: ${{ secrets.TMONE_BUCKET }}
          TMONE_ACCESS_KEY_ID: ${{ secrets.TMONE_ACCESS_KEY_ID }}
          TMONE_SECRET_ACCESS_KEY: ${{ secrets.TMONE_SECRET_ACCESS_KEY }}
          # boto3 >=1.36 and recent AWS CLI v2 add CRC request checksums that
          # Huawei OBS rejects with XAmzContentSHA256Mismatch — the same trap
          # app/services/family_library.py disables in its boto3 client.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Belt and braces: the job-level `if` already restricts this to
          # -staging, but a signed prod publish must not be one edited
          # condition away.
          if (-not '${{ github.ref_name }}'.EndsWith('-staging')) {
            throw "refusing to auto-sign a non-staging tag: ${{ github.ref_name }}"
          }
          ./installer/sign-release.ps1 `
            -Tag '${{ github.ref_name }}' `
            -Thumbprint '${{ secrets.CERT_THUMBPRINT }}'

      - name: Report what was published
        shell: pwsh
        run: |
          Write-Host "published ${{ github.ref_name }} to TM One"
          Write-Host "latest.json is flipped — bina-ai /addin/version.json will serve it within its 600s cache"
