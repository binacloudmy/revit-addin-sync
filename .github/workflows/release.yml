# Release build + verification pipeline (sovereign delivery).
#
# Flow: git tag v0.0.2 && git push --tags
#   → builds plugin + loader with Version=0.0.2 (UNSIGNED — CI has no cert)
#   → RevitWebAppSync-0.0.2.zip (OTA payload) + RevitCopilot-0.0.2-setup.exe
#   → uploads them as GitHub workflow artifacts (build record / staging smoke)
#
# Three actors now (operator decision 2026-08-04 split an unsigned staging
# path off the manual one — this workflow's `release` job is still only a
# build; it never publishes anything itself):
#
#   RUNNER (`release` job, automated, GitHub-hosted):
#     - builds the plugin payload + loaders + installer EXE, UNSIGNED;
#     - uploads them as GitHub workflow artifacts (build record / staging
#       smoke source, and — for -staging tags — what publish-staging-unsigned
#       below ships as-is);
#     - publishes NOTHING itself: no GitHub Release, no TM One upload, no
#       pointer flip, no cert. (TM One creds now DO exist in GitHub secrets —
#       see publish-staging-unsigned — but this job never touches them.)
#
#   CI, UNSIGNED (`publish-staging-unsigned` job, automated, GitHub-hosted,
#   STAGING TAGS ONLY): reuses this job's own unsigned zip AND setup EXE,
#   uploads both straight to TM One's staging prefix and flips latest.json
#   with the CURRENT version's installer_key — no cert, no signing box, no
#   human click, and fresh installs (not just OTA updates) land on the
#   current version. Runs only while no self-hosted signer is registered
#   (vars.SELF_HOSTED_SIGNER != 'true'); the signed staging path below
#   always wins once one exists, so the two never race. See
#   installer\publish-unsigned-staging.ps1 for why this is safe for staging
#   and would not be for prod.
#
#   OPERATOR (separate, manual, on the sovereign signing box — always for
#   PROD, and for STAGING too while SELF_HOSTED_SIGNER=true):
#     - runs installer\sign-release.ps1, which rebuilds + SIGNS every payload DLL
#       and the setup EXE, uploads the signed installer + OTA zip to TM One, and
#       flips the latest.json pointer that bina-ai /addin/download and
#       /addin/version.json resolve. THIS is go-live for prod, always.
#
# Why the split still matters for prod: unsigned bytes never reach a
# fleet-facing URL (the signing gate); build compute stays in-country; prod's
# TM One credentials and the signing cert live only on the signing box, never
# in GitHub secrets. Staging's TM One creds DO live in GitHub secrets now —
# that is the 2026-08-04 decision, justified by staging's small blast radius
# (mandatory:false, a handful of testers) — but prod is untouched by it.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.0.2) — build only, no publish'
        required: true

permissions:
  contents: read

jobs:
  release:
    # TEMPORARY: GitHub-hosted. The sovereign intent is a self-hosted Windows
    # runner so build compute stays in-country (added 2026-07-27, PR #51) —
    # but no such runner is registered, so every tagged release simply QUEUED
    # forever with no failure and no log. v0.0.30-staging sat unassigned for
    # 14 minutes before anyone noticed, because an unassigned job looks
    # identical to a slow one.
    #
    # Reverted to unblock staging. Restore `runs-on: [self-hosted, windows]`
    # once a runner is registered (repo Settings -> Actions -> Runners), and
    # verify by pushing a throwaway tag BEFORE relying on it for a release —
    # this failure mode is silent.
    #
    # Note what this does NOT change: the runner still produces unsigned
    # artifacts only and never publishes them itself. For prod, signing, the
    # TM One upload and the latest.json flip always stay on the operator's
    # box, so no prod key or credential is exposed by building here rather
    # than in-country. Staging is the one exception (operator decision
    # 2026-08-04, publish-staging-unsigned job, below) — its TM One creds are
    # deliberately in GitHub secrets, scoped to the staging bucket only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0 builds net8.0-windows (+ net48 via reference assemblies);
          # 10.0 builds the Revit 2027 net10.0-windows payload.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          # Exactly two channels:
          #   vX.Y.Z          -> Release build (prod backend), fleet OTA
          #                      (becomes releases/latest -> mandatory).
          #   vX.Y.Z-staging  -> Staging build (staging backend, updater
          #                      disabled via .env.staging), published as
          #                      a GitHub PRERELEASE, which releases/latest
          #                      excludes -> no prod user is ever touched;
          #                      testers install by direct link only.
          # Binaries always carry the numeric core (AssemblyVersion=$(Version)
          # cannot take a suffix).
          if ($v -notmatch '^(\d+\.\d+\.\d+)(-staging)?$') {
            throw "Bad version '$v' — want MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-staging"
          }
          $numeric = $Matches[1]
          $isStaging = [bool]$Matches[2]
          "version=$numeric" >> $env:GITHUB_OUTPUT
          "fullversion=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($isStaging) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "config=$(if ($isStaging) { 'Staging' } else { 'Release' })" >> $env:GITHUB_OUTPUT

      - name: Publish plugin (OTA payload, per-target subfolders)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          # Multi-year layout (BinaLoader ResolvePayloadDir): one subfolder per
          # target runtime + a root manifest.json carrying the year->subfolder
          # map. ALWAYS publish with an explicit -f — a multi-TFM publish
          # without one shipped a net10 payload to a .NET 8 Revit (2026-07-13).
          $targets = [ordered]@{ "net8.0-windows" = "net8.0"; "net10.0-windows" = "net10.0" }
          if ((Get-Content RevitWebAppSync.csproj -Raw) -match '<TargetFrameworks>[^<]*net48') {
            $targets["net48"] = "net48"   # Phase B auto-activates
          }
          $yearMap = [ordered]@{}
          foreach ($tfm in $targets.Keys) {
            $sub = $targets[$tfm]
            dotnet publish RevitWebAppSync.csproj -c '${{ steps.ver.outputs.config }}' -f $tfm -o "artifacts/plugin/$sub" -p:Version=$v
            if ($LASTEXITCODE -ne 0) { exit 1 }
            @{ version = $v; assembly = 'RevitWebAppSync.dll'; entryType = 'RevitWebAppSync.App' } |
              ConvertTo-Json | Set-Content "artifacts/plugin/$sub/manifest.json"
            switch ($sub) {
              "net48"   { $yearMap["2023"] = $sub; $yearMap["2024"] = $sub }
              "net8.0"  { $yearMap["2025"] = $sub; $yearMap["2026"] = $sub }
              "net10.0" { $yearMap["2027"] = $sub }
            }
          }
          # Root manifest: which dll/type to bootstrap + the targets map.
          @{ version = $v; assembly = 'RevitWebAppSync.dll'; entryType = 'RevitWebAppSync.App'; targets = $yearMap } |
            ConvertTo-Json | Set-Content artifacts/plugin/manifest.json
          & installer/prune-payload.ps1 -PluginDir artifacts/plugin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem artifacts/plugin -Recurse -Filter *.pdb | Remove-Item -ErrorAction SilentlyContinue

      - name: Publish loaders (net8 for 2025-2027, net48 for 2024)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          dotnet publish BinaLoader/BinaLoader.csproj -c Release -f net8.0-windows -o artifacts/loader-net8 -p:Version=$v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item BinaLoader/BinaSync.addin artifacts/loader-net8/
          dotnet publish BinaLoader/BinaLoader.csproj -c Release -f net48 -o artifacts/loader-net48 -p:Version=$v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item BinaLoader/BinaSync.addin artifacts/loader-net48/
          Get-ChildItem artifacts -Recurse -Filter *.pdb | Remove-Item -ErrorAction SilentlyContinue

      # Colocated-engine channel. Three sources, first match wins:
      #
      #   1. ENGINE_ZIP_URL repository variable — explicit override for cutting
      #      a NEW engine (a bina-engine-<ver>.zip from bina-ai
      #      scripts/build-engine-bundle.ps1 at any GET-able URL).
      #   2. STAGING TAGS: the channel's own latest.json on TM One. Whatever
      #      engine the feed already serves, the installer seeds the identical
      #      bytes (sha-verified) — see installer/fetch-engine-bundle.ps1. This
      #      is the default path and it FAILS the build if the pointer names an
      #      engine we cannot fetch. Every staging release before 2026-08-27
      #      shipped addin-only because nobody set (1), and a fresh install had
      #      no engine until an OTA cycle completed; everything in between
      #      failed silently. Never again.
      #   3. PROD TAGS with no override: addin-only, with a visible warning.
      #      Prod's TM One creds are deliberately NOT in GitHub (sovereign
      #      delivery — signing, upload and pointer flip stay on the operator's
      #      box), so this job cannot read the prod pointer. Set (1) for a prod
      #      release that must carry the engine.
      - name: Fetch engine bundle
        id: engine
        shell: pwsh
        env:
          TMONE_SERVER: ${{ secrets.TMONE_SERVER }}
          TMONE_BUCKET: ${{ secrets.TMONE_BUCKET }}
          TMONE_ACCESS_KEY_ID: ${{ secrets.TMONE_ACCESS_KEY_ID }}
          TMONE_SECRET_ACCESS_KEY: ${{ secrets.TMONE_SECRET_ACCESS_KEY }}
        run: |
          $url = '${{ vars.ENGINE_ZIP_URL }}'
          $isStaging = '${{ steps.ver.outputs.prerelease }}' -eq 'true'

          if ($url) {
            Write-Host "ENGINE_ZIP_URL set — fetching explicit engine bundle"
            Invoke-WebRequest $url -OutFile engine-download.zip
            Expand-Archive engine-download.zip -DestinationPath artifacts/engine
            $manifest = Get-Content artifacts/engine/engine-version.json -Raw | ConvertFrom-Json
            $ev = $manifest.engine_version
            if (-not $ev) { throw "engine-version.json in $url has no engine_version" }
            $zip = "bina-engine-$ev.zip"
            Move-Item engine-download.zip $zip
            $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            Write-Host "engine bundle $ev ($zip, sha256=$sha)"
            "present=true" >> $env:GITHUB_OUTPUT
            "version=$ev" >> $env:GITHUB_OUTPUT
            "sha256=$sha" >> $env:GITHUB_OUTPUT
            "zip=$zip" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not $isStaging) {
            Write-Warning "prod tag with no ENGINE_ZIP_URL — addin-only release (prod pointer is operator-side by design)"
            "present=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            throw "aws CLI not on PATH on windows-latest runner"
          }
          $r = & installer/fetch-engine-bundle.ps1 `
                 -Prefix 'revit-copilot/releases-staging' `
                 -OutDir (Join-Path (Get-Location) 'artifacts/engine')
          if ($r.present -eq 'true') {
            # Re-attach under the conventional name so the GitHub release
            # asset matches what the feed json below links to.
            Copy-Item $r.zip "bina-engine-$($r.version).zip"
            "zip=bina-engine-$($r.version).zip" >> $env:GITHUB_OUTPUT
          }

      - name: Zip payload + feed json
        id: payload
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $zip = "RevitWebAppSync-$v.zip"
          Compress-Archive -Path artifacts/plugin/* -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $feed = [ordered]@{
            version   = $v
            url       = "https://github.com/${{ github.repository }}/releases/download/v$v/$zip"
            sha256    = $sha
            notes     = "BINA Sync $v"
            # Stale clients are blocked until they update (UpdateWindow gate).
            # Flip to $false for releases old builds may keep using.
            mandatory = $true
          }
          # Colocated-engine channel: FLAT fields, the shape
          # UpdateService.CheckEngineAsync actually reads (the old nested
          # {engine:{...}} block was never consumed by any client).
          if ('${{ steps.engine.outputs.present }}' -eq 'true') {
            $feed.engineVersion = '${{ steps.engine.outputs.version }}'
            $feed.engineUrl     = "https://github.com/${{ github.repository }}/releases/download/v$v/${{ steps.engine.outputs.zip }}"
            $feed.engineSha256  = '${{ steps.engine.outputs.sha256 }}'
            Write-Host "feed carries engine $($feed.engineVersion)"
          }
          $feed | ConvertTo-Json -Depth 5 | Set-Content version.json
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup EXE)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          # Seed folder must look exactly like an updater-staged one.
          Set-Content artifacts/plugin/.complete $v
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          # ABSOLUTE source dirs — relative paths once made the old WiX MSI
          # harvest nothing and ship 32KB shells (v0.0.1-v0.0.6).
          $loaderNet8Dir = (Resolve-Path artifacts/loader-net8).Path
          $pluginDir = (Resolve-Path artifacts/plugin).Path
          # Addins\2024 registration only when a 2024 payload exists — a net48
          # loader with nothing to load dead-ends 2024 users on a reinstall dialog.
          $net48Arg = @()
          if (Test-Path artifacts/plugin/net48) {
            $net48Arg = @("/DLoaderNet48Dir=$((Resolve-Path artifacts/loader-net48).Path)")
          }
          # Seed the fetched engine bundle into the installer. DestDir must be
          # the ENGINE's own version (EngineManager scans engine\<ver>\ by
          # semver), never the addin version.
          $engineArg = @()
          if ('${{ steps.engine.outputs.present }}' -eq 'true') {
            $engineDir = (Resolve-Path artifacts/engine).Path
            $engineArg = @("/DEngineDir=$engineDir", "/DEngineVersion=${{ steps.engine.outputs.version }}")
          }
          & $iscc installer/RevitCopilot.iss /DAppVersion=$v "/DLoaderNet8Dir=$loaderNet8Dir" "/DPluginDir=$pluginDir" @net48Arg @engineArg /Oinstaller
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item "installer/RevitCopilot-$v-setup.exe" .
          # Guard: a payload-less installer is tiny; the real one carries the
          # whole plugin. Never ship a shell again.
          $size = (Get-Item "RevitCopilot-$v-setup.exe").Length
          if ($size -lt 1MB) { throw "Installer is only $([math]::Round($size/1KB)) KB — harvest failed, refusing to release" }

      # No GitHub Release, no TM One upload HERE — this step produces UNSIGNED
      # bytes only. What happens to them next depends on the channel:
      #   * prod, and staging when SELF_HOSTED_SIGNER=true: the operator's
      #     sign-and-flip step (installer\sign-release.ps1) rebuilds, SIGNS the
      #     payload + EXE, uploads to TM One and flips the pointer.
      #   * staging when SELF_HOSTED_SIGNER != 'true' (the default today): the
      #     publish-staging-unsigned job below re-downloads THIS artifact and
      #     ships BOTH the zip and the setup EXE built above to TM One's
      #     staging prefix AS-IS — unsigned, by operator decision 2026-08-04.
      #     See installer\publish-unsigned-staging.ps1 (-PublishInstaller).
      # Either way, this artifact is also the build record + staging smoke
      # source. Both files below are load-bearing for publish-staging-unsigned
      # — do not narrow this glob without checking that job first.
      - name: Upload build artifacts (unsigned build record)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.fullversion }}
          path: |
            RevitWebAppSync-*.zip
            RevitCopilot-*-setup.exe

  # ─── Staging auto-sign + publish ────────────────────────────────────────
  # STAGING ONLY, and a SEPARATE job on purpose.
  #
  # Separate because the build must not depend on the signing box being up.
  # When release.yml briefly ran wholly on [self-hosted, windows] with no
  # runner registered, v0.0.30-staging simply QUEUED — no failure, no log,
  # nothing to debug, because an unassigned job is indistinguishable from a
  # slow one. Split like this, the build always runs on windows-latest and
  # only this job waits; artifacts still exist and the operator can sign by
  # hand as before.
  #
  # Why self-hosted is unavoidable here: Certum's private key never leaves
  # their cloud, and SimplySign Desktop must hold an AUTHENTICATED session
  # before signtool can see the key. There is no API credential to put in
  # GitHub secrets — an ephemeral GitHub-hosted VM cannot hold that session.
  # So this job runs on the signing box, which keeps SimplySign logged in.
  # That session EXPIRES; the preflight below reports it plainly instead of
  # failing later inside signtool.
  #
  # GATED OFF UNTIL A RUNNER EXISTS. `runs-on: [self-hosted, windows]` with no
  # registered runner does not fail — it QUEUES, forever, exactly as described
  # four paragraphs up. The preflight cannot save us there: a job whose labels
  # match no runner never starts, so not one of its steps runs and there is no
  # message to read. Re-introducing that condition here would have reproduced
  # the same invisible hang on the next -staging tag, with the incident report
  # sitting directly above it.
  #
  # So the job is skipped unless the repo variable SELF_HOSTED_SIGNER is
  # 'true'. A skipped job is legible — it appears in the checks list greyed
  # out — whereas a queued one is indistinguishable from a slow build. To turn
  # it on: register the signing box as a self-hosted runner with the
  # `windows` label, then
  #   gh variable set SELF_HOSTED_SIGNER --body true
  # Until then, staging auto-publishes UNSIGNED via publish-staging-unsigned
  # (below, operator decision 2026-08-04) — that job is gated off the moment
  # this one turns on, so the two never race. A manual
  # installer\sign-release.ps1 run on the signing box is still always
  # available too. The build job itself still runs on windows-latest and
  # still uploads artifacts either way, so nothing is blocked.
  #
  # Prod is deliberately excluded. A fleet-wide update should have a human
  # in the loop, so `v0.0.31` (no suffix) still goes through
  # installer\sign-release.ps1 by hand.
  sign-staging:
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && endsWith(github.ref_name, '-staging')
      && vars.SELF_HOSTED_SIGNER == 'true'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          # sign-release.ps1 resolves the tag with `git rev-list -n 1 $Tag`
          # and refuses unless HEAD matches it, so the full history + tags
          # must be present. A shallow checkout fails that gate.
          fetch-depth: 0

      # Fail BEFORE the expensive part. sign-release.ps1 does its full signed
      # build at line ~97 but only validates TM One credentials at line ~134,
      # so a missing variable would compile and sign everything, burn a
      # SimplySign session, then die before publishing a single byte.
      - name: Preflight (fail fast, protect the signing session)
        shell: pwsh
        env:
          TMONE_SERVER: ${{ secrets.TMONE_SERVER }}
          TMONE_BUCKET: ${{ secrets.TMONE_BUCKET }}
          TMONE_ACCESS_KEY_ID: ${{ secrets.TMONE_ACCESS_KEY_ID }}
          TMONE_SECRET_ACCESS_KEY: ${{ secrets.TMONE_SECRET_ACCESS_KEY }}
        run: |
          $missing = @()
          foreach ($k in 'TMONE_SERVER','TMONE_BUCKET','TMONE_ACCESS_KEY_ID','TMONE_SECRET_ACCESS_KEY') {
            if (-not (Get-Item "env:$k" -ErrorAction SilentlyContinue).Value) { $missing += $k }
          }
          if ($missing) { throw "Missing repo secrets: $($missing -join ', ')" }

          # The upload step shells out to a bare `aws`. It was not installed on
          # the signing box the first time this was attempted, so every S3 copy
          # would have thrown AFTER signing.
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            throw "aws CLI not on PATH — install once: winget install --id Amazon.AWSCLI -e"
          }

          # SIGNTOOL_ARGS and -Thumbprint are mutually exclusive in the script;
          # a stale value in the machine environment would abort the run.
          if ($env:SIGNTOOL_ARGS) { throw "SIGNTOOL_ARGS is set; unset it so -Thumbprint takes the pre-trust path" }

          # Certum's key is only visible while SimplySign holds a session. If it
          # lapsed, say so plainly instead of failing later inside signtool.
          $tp = '${{ secrets.CERT_THUMBPRINT }}'
          if (-not $tp) { throw "CERT_THUMBPRINT secret not set" }
          if (-not (Test-Path "Cert:\CurrentUser\My\$tp")) {
            throw "Cert $tp not in CurrentUser\My — SimplySign session has expired. Re-authenticate on this box."
          }
          Write-Host "preflight OK — creds present, aws found, SimplySign session live"

      - name: Sign, upload to TM One, flip latest.json
        shell: pwsh
        env:
          TMONE_SERVER: ${{ secrets.TMONE_SERVER }}
          TMONE_BUCKET: ${{ secrets.TMONE_BUCKET }}
          TMONE_ACCESS_KEY_ID: ${{ secrets.TMONE_ACCESS_KEY_ID }}
          TMONE_SECRET_ACCESS_KEY: ${{ secrets.TMONE_SECRET_ACCESS_KEY }}
          # boto3 >=1.36 and recent AWS CLI v2 add CRC request checksums that
          # Huawei OBS rejects with XAmzContentSHA256Mismatch — the same trap
          # app/services/family_library.py disables in its boto3 client.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Belt and braces: the job-level `if` already restricts this to
          # -staging, but a signed prod publish must not be one edited
          # condition away.
          if (-not '${{ github.ref_name }}'.EndsWith('-staging')) {
            throw "refusing to auto-sign a non-staging tag: ${{ github.ref_name }}"
          }
          ./installer/sign-release.ps1 `
            -Tag '${{ github.ref_name }}' `
            -Thumbprint '${{ secrets.CERT_THUMBPRINT }}'

      - name: Report what was published
        shell: pwsh
        run: |
          Write-Host "published ${{ github.ref_name }} to TM One"
          Write-Host "latest.json is flipped — bina-ai /addin/version.json will serve it within its 600s cache"

  # ─── Staging unsigned auto-publish (CI, no signing box) ─────────────────────
  # STAGING ONLY. Operator decision 2026-08-04: staging-channel releases
  # publish to TM One WITHOUT signing, straight from this GitHub-hosted
  # runner — prod keeps the human-gated signing box (sign-prod, below)
  # completely untouched.
  #
  # This closes the gap sign-staging leaves open while no self-hosted signer
  # is registered: today that means CI "publishes nothing users can
  # download" (see the header comment above `release:`), so an unsigned
  # staging tag with no signer box would otherwise never reach a tester.
  # `if:` below is sign-staging's condition with SELF_HOSTED_SIGNER inverted,
  # so the signed path always wins the moment a signer exists — the two jobs
  # can never both publish the same tag.
  #
  # Why unsigned is acceptable here, and only here: staging mandatory
  # defaults false (UpdateService never force-restarts a tester's Revit
  # session over an unsigned build); the staging fleet is a handful of known
  # testers, not the whole drafter population; and Smart App Control / WDAC
  # (Enforce) machines blocking an unsigned DLL at load (0x800711C7,
  # 2026-07-21 incident) is a known, accepted risk for that population only.
  # Prod cannot take this shortcut — its feeds are mandatory:true and reach
  # every drafter at their next Revit launch; that path stays fully
  # human-gated below (sign-prod).
  #
  # No rebuild, no re-sign: this job downloads the SAME unsigned artifact the
  # `release` job above already produced and re-publishes what it contains
  # as-is — the OTA zip AND the setup EXE (-PublishInstaller). The `release`
  # job's "Build installer (Inno Setup EXE)" step already runs unconditionally
  # for every tag (has since 2026-06-11, well before this job existed) and its
  # output is already part of the same `release-<version>` artifact this job
  # downloads, so publishing the installer here costs nothing extra — no
  # second Inno Setup install, no recompiling the .iss. Without
  # -PublishInstaller fresh staging installs would stay pinned to whatever
  # version the last SIGNED release happened to be (installer_key carried
  # forward) even as OTA updates raced ahead on every subsequent unsigned tag;
  # -PublishInstaller keeps fresh installs on the CURRENT version instead. See
  # installer\publish-unsigned-staging.ps1 for the full reasoning, the
  # installer_key naming convention (identical to sign-release.ps1's), and the
  # accepted SmartScreen-warning trade-off on the unsigned EXE.
  publish-staging-unsigned:
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && endsWith(github.ref_name, '-staging')
      && vars.SELF_HOSTED_SIGNER != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          # Mirrors the `release` job's own derivation for a tag push (this
          # job never runs for workflow_dispatch — see the `if:` above).
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "fullversion=$v" >> $env:GITHUB_OUTPUT

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.fullversion }}
          path: artifact

      - name: Verify aws CLI
        shell: pwsh
        run: |
          # windows-latest ships aws-cli by default; this is a cheap, legible
          # failure if that ever stops being true, instead of a confusing
          # error deep inside the publish script.
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            throw "aws CLI not on PATH on windows-latest runner"
          }
          aws --version

      - name: Publish unsigned OTA + installer to TM One, flip latest.json
        shell: pwsh
        env:
          TMONE_SERVER: ${{ secrets.TMONE_SERVER }}
          TMONE_BUCKET: ${{ secrets.TMONE_BUCKET }}
          TMONE_ACCESS_KEY_ID: ${{ secrets.TMONE_ACCESS_KEY_ID }}
          TMONE_SECRET_ACCESS_KEY: ${{ secrets.TMONE_SECRET_ACCESS_KEY }}
          # boto3 >=1.36 and recent AWS CLI v2 add CRC request checksums that
          # Huawei OBS rejects with XAmzContentSHA256Mismatch — the same trap
          # sign-staging/sign-prod carry and app/services/family_library.py
          # (bina-ai) disables in its boto3 client. Load-bearing.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # -PublishInstaller ships RevitCopilot-<version>-setup.exe from the
          # SAME downloaded artifact — it is already built unsigned by the
          # `release` job's "Build installer (Inno Setup EXE)" step above, so
          # this does not compile anything on this runner (no Inno Setup
          # install needed here). Accepted trade-off, staging only: the EXE
          # has no Authenticode signature, so SmartScreen warns on
          # download/run — operator decision 2026-08-04, same as the unsigned
          # OTA payload.
          ./installer/publish-unsigned-staging.ps1 `
            -Tag '${{ github.ref_name }}' `
            -PayloadDir artifact `
            -PublishInstaller

      - name: Report what was published
        shell: pwsh
        run: |
          Write-Host "published ${{ github.ref_name }} (UNSIGNED, OTA + installer) to TM One's staging prefix"
          Write-Host "latest.json is flipped — bina-ai /addin/version.json will serve it within its 600s cache"
          Write-Host "fresh installs now land on this version's unsigned setup EXE too"

  # ─── Prod publish — same box, but a human says go ───────────────────────────
  # Identical machinery to sign-staging with one difference that is the whole
  # point: `environment: production`. A tag push builds and then WAITS on a
  # required reviewer in that environment's settings; nothing is signed or
  # uploaded until someone approves in the Actions UI.
  #
  # Why prod does not just auto-publish like staging: prod feeds are
  # mandatory:true, so publishing force-updates every drafter at their next
  # Revit launch, and there is no recall — only a higher version behind it. A
  # mistagged commit would reach the whole fleet. Staging is recoverable
  # (mandatory:false, a handful of testers); prod is not. The approval click is
  # the cheapest possible place to keep a human, and unlike the old runbook it
  # does not require that human to be sitting at the Windows box.
  #
  # sign-release.ps1 does MORE on a prod tag than on staging: after TM One and
  # the pointer flip it publishes the signed GitHub Release that the pre-0.0.34
  # fleet still polls. That step shells out to `gh`, which needs auth — hence
  # GH_TOKEN below. Without it the script fails its own gh preflight before the
  # build, which is the correct place to fail but a confusing one to debug.
  sign-prod:
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && !endsWith(github.ref_name, '-staging')
      && vars.SELF_HOSTED_SIGNER == 'true'
    runs-on: [self-hosted, windows]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # sign-release.ps1 resolves the tag with `git rev-list -n 1 $Tag` and
          # refuses unless HEAD matches, so full history + tags are required.
          fetch-depth: 0

      - name: Preflight (fail fast, protect the signing session)
        shell: pwsh
        env:
          TMONE_SERVER: ${{ secrets.TMONE_SERVER }}
          TMONE_BUCKET: ${{ secrets.TMONE_BUCKET }}
          TMONE_ACCESS_KEY_ID: ${{ secrets.TMONE_ACCESS_KEY_ID }}
          TMONE_SECRET_ACCESS_KEY: ${{ secrets.TMONE_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $missing = @()
          foreach ($k in 'TMONE_SERVER','TMONE_BUCKET','TMONE_ACCESS_KEY_ID','TMONE_SECRET_ACCESS_KEY') {
            if (-not (Get-Item "env:$k" -ErrorAction SilentlyContinue).Value) { $missing += $k }
          }
          if ($missing) { throw "Missing repo secrets: $($missing -join ', ')" }

          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            throw "aws CLI not on PATH — install once: winget install --id Amazon.AWSCLI -e"
          }
          if (-not (Get-Command signtool -ErrorAction SilentlyContinue)) {
            throw "signtool not on PATH — install the Windows SDK / VS BuildTools on this box"
          }
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "gh CLI not on PATH — needed for the prod GitHub bridge release: winget install GitHub.cli"
          }
          if ($env:SIGNTOOL_ARGS) { throw "SIGNTOOL_ARGS is set; unset it so -Thumbprint takes the pre-trust path" }

          $tp = '${{ secrets.CERT_THUMBPRINT }}'
          if (-not $tp) { throw "CERT_THUMBPRINT secret not set" }
          if (-not (Test-Path "Cert:\CurrentUser\My\$tp")) {
            throw "Cert $tp not in CurrentUser\My — SimplySign session has expired. Re-authenticate on this box."
          }
          Write-Host "preflight OK — creds, aws, signtool, gh, SimplySign session all present"

      - name: Sign, upload to TM One, flip pointer, publish GitHub bridge
        shell: pwsh
        env:
          TMONE_SERVER: ${{ secrets.TMONE_SERVER }}
          TMONE_BUCKET: ${{ secrets.TMONE_BUCKET }}
          TMONE_ACCESS_KEY_ID: ${{ secrets.TMONE_ACCESS_KEY_ID }}
          TMONE_SECRET_ACCESS_KEY: ${{ secrets.TMONE_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mirror of the staging guard, inverted: a staging tag must never take
          # the prod path, where mandatory defaults to true and the GitHub
          # bridge publishes to the URL the whole fleet polls.
          if ('${{ github.ref_name }}'.EndsWith('-staging')) {
            throw "refusing to publish a -staging tag through the prod job: ${{ github.ref_name }}"
          }
          # -Mandatory is deliberately NOT passed: a prod tag resolves it to
          # true on its own, and passing it explicitly is how that decision
          # gets silently inverted later.
          ./installer/sign-release.ps1 `
            -Tag '${{ github.ref_name }}' `
            -Thumbprint '${{ secrets.CERT_THUMBPRINT }}'

      - name: Report what was published
        shell: pwsh
        run: |
          Write-Host "published ${{ github.ref_name }} to TM One (prod prefix) AND as a signed GitHub Release"
          Write-Host "the fleet force-updates at each drafter's next Revit launch — mandatory:true"
