# Renders the JKR Audit Copilot panel to PNGs on a real Windows runner and
# uploads them as a build artifact.
#
# Why this exists: the panel is WPF, so it cannot be rendered on macOS/Linux —
# Microsoft.WindowsDesktop.App does not exist there. Without this, "is the panel
# 1:1 with the Claude Design canvas?" can only be answered by someone who owns a
# Windows machine. UiHarness ships metadata-only Revit stubs, so the runner needs
# no Revit install.
#
# Download the artifact from the run's summary page and diff the PNGs against
# docs/model-audit/2-design/claude-design/"JKR Audit Copilot.dc.html".
name: jkr-shots

on:
  pull_request:
    paths:
      - 'UI/**'
      - 'UiHarness/**'
      - 'Models/JkrCopilotModels.cs'
      - 'Services/*Copilot*.cs'
      - '.github/workflows/jkr-shots.yml'
  workflow_dispatch:

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build harness
        run: dotnet build UiHarness/UiHarness.csproj -c Release

      # The harness is a WinExe; run it headlessly. It opens each window
      # off-screen (Left/Top -4000) and closes it after the render, so no
      # interactive desktop session is required.
      - name: Render panel screens
        run: dotnet run --project UiHarness/UiHarness.csproj -c Release --no-build -- --shot-jkr "${{ github.workspace }}\jkr-shots"

      # Every screen must produce a file. A silent seeding failure would
      # otherwise ship a half-empty artifact that looks like a pass.
      - name: Check every screen rendered
        shell: pwsh
        run: |
          $expected = @(
            'jkr-s1-run-start.png','jkr-s1-run-ready.png','jkr-s2-progress.png',
            'jkr-s3-fix-queue.png','jkr-s3-tab-open.png','jkr-s3-tab-manual.png',
            'jkr-s3-tab-ignored.png','jkr-s3-tab-resolved.png','jkr-s3-density-large.png',
            'jkr-s4-detail.png','jkr-s4-detail-manual.png','jkr-s5-manual.png','jkr-s6-export.png'
          )
          $dir = "${{ github.workspace }}\jkr-shots"
          $missing = @()
          foreach ($f in $expected) {
            $p = Join-Path $dir $f
            if (-not (Test-Path $p)) { $missing += "$f (absent)" }
            elseif ((Get-Item $p).Length -lt 5kb) { $missing += "$f (suspiciously small)" }
          }
          Get-ChildItem $dir | Format-Table Name, Length
          if ($missing.Count -gt 0) {
            Write-Error "Screens did not render: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All $($expected.Count) screens rendered."

      - uses: actions/upload-artifact@v4
        with:
          name: jkr-panel-screens
          path: jkr-shots/*.png
          if-no-files-found: error
