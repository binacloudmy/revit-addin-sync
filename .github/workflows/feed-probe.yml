name: feed-probe
# Synthetic canary for the OTA update feed: validates the manifest is
# well-formed and its payload URLs are actually downloadable. Fails the job
# (-> GitHub failure notification) when the feed would break updaters.
# NOTE: scheduled workflows only run from the repo's DEFAULT branch — this
# file must land there before the cron fires.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

env:
  FEED_URL: https://github.com/binacloudmy/revit-addin-sync/releases/latest/download/version.json

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and validate feed manifest
        run: |
          set -euo pipefail
          curl -sfL "$FEED_URL" -o version.json
          jq -e '.version and .url and .sha256' version.json > /dev/null \
            || { echo "::error::feed missing version/url/sha256"; exit 1; }
          echo "feed version: $(jq -r .version version.json)"

      - name: HEAD the addin payload
        run: |
          set -euo pipefail
          curl -sfIL "$(jq -r .url version.json)" > /dev/null \
            || { echo "::error::addin zip URL not downloadable"; exit 1; }

      - name: HEAD the engine payload (when present)
        run: |
          set -euo pipefail
          eu=$(jq -r '.engineUrl // empty' version.json)
          if [ -n "$eu" ]; then
            curl -sfIL "$eu" > /dev/null \
              || { echo "::error::engine zip URL not downloadable"; exit 1; }
          else
            echo "no engine channel in feed — skipped"
          fi
